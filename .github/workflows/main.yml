name: Auto Update Lottery Results

on:
  schedule:
    # ශ්‍රී ලංකාවේ වේලාවෙන් රාත්‍රී 11.00 ට (UTC 17:30) ස්වයංක්‍රීයව run වේ
    - cron: '30 17 * * *'
  workflow_dispatch: # Manual run කිරීමට

jobs:
  update-results:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4
        sudo apt-get update && sudo apt-get install -y lftp

    - name: Run Scraper
      run: python scraper.py

    - name: Upload to InfinityFree via LFTP
      env:
        FTP_SERVER: ${{ secrets.FTP_SERVER }}
        FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
        FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      run: |
        lftp -e "set ftp:ssl-allow no; open $FTP_SERVER; user $FTP_USERNAME '$FTP_PASSWORD'; mirror -R --delete --verbose ./ /htdocs/; quit"
