name: Auto Update Lottery Results

on:
  schedule:
    # ශ්‍රී ලංකාවේ වේලාවෙන් රාත්‍රී 11.00 ට (UTC 17:30) ස්වයංක්‍රීයව run වේ
    - cron: '30 17 * * *'
  workflow_dispatch: # Manual run කිරීමට

jobs:
  update-results:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Run Scraper
      run: python scraper.py

    - name: FTP Deploy to InfinityFree
      uses: SamKirsch/ftp-deploy-action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./
        server-dir: /htdocs/
